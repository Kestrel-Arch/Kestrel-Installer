[package]
name = "kestrel-gui"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.7.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
sysinfo = "0.31"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "fs", "process", "user"] }

[build-dependencies]
slint-build = "1.7.2"

# ==========================================
# KESTREL COMPRESSION MATRIX
# ==========================================
[profile.release]
opt-level = "z"     # Optimize aggressively for binary size
lto = true          # Enable Link Time Optimization (huge size reduction)
codegen-units = 1   # Slower compile time, but maximum compression
panic = "abort"     # Removes panic unwinding infrastructure (saves RAM)
strip = true        # Strips debug symbols (The biggest space saver!)
