[package]
name = "kestrel-gui"
version = "0.2.0"
edition = "2021"
build = "build.rs"
default-run = "kestrel-gui"

[[bin]]
name = "kestrel-gui"
path = "src/main.rs"

[[bin]]
name = "kestrel-doctor"
path = "src/bin/kestrel-doctor.rs"

[dependencies]
slint = "1.7.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
sysinfo = "0.31"
regex = "1.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "fs", "process", "user", "sched"] }

[build-dependencies]
slint-build = "1.7.2"

# ==========================================
# KESTREL EXTREME COMPRESSION MATRIX
# ==========================================
[profile.release]
opt-level = "z"     # Optimize aggressively for binary size
lto = true          # Enable Link Time Optimization (huge size reduction)
codegen-units = 1   # Slower compile time, but maximum compression
panic = "abort"     # Removes panic unwinding infrastructure (saves RAM)
strip = true        # Strips debug symbols (The biggest space saver!)
