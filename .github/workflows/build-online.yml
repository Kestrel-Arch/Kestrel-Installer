name: Build Kestrel Arch ISO (Online)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'CNAME'
      - 'LICENSE'
      - '.github/workflows/pages-build-deployment.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'web/**'
      - 'docs/**'
      - 'bootstrap'
      - 'bootstrap/**'
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: "iso-online"
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build-archiso-online:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: archlinux:latest
      options: --privileged

    steps:
            - name: Initialize Arch Keyring & Install Dependencies
        run: |
          cat << 'EOF' > /etc/pacman.d/mirrorlist
          Server = https://pkgbuild.com
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://pkgbuild.com
          EOF
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git archiso wget gawk mtools dosfstools erofs-utils squashfs-tools \
            pacman-contrib rustup base-devel cmake pkgconf freetype2 fontconfig \
            libx11 libxkbcommon libxcb wayland openssh rsync github-cli python-pip zstd tar

          pacman-key --recv-key 3056513887B78AEB --keyserver hkps://keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://chaotic.cx' \
            'https://chaotic.cx'

          rustup default stable

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: airootfs/gui-src -> target

      - name: Build Kestrel GUI
        run: |
          mkdir -p airootfs/gui-src/ui/fonts
          cp Geomini.ttf airootfs/gui-src/ui/fonts/ 2>/dev/null || true
          cp CascadiaCode.ttf airootfs/gui-src/ui/fonts/ 2>/dev/null || true

          cd airootfs/gui-src
          cargo build --release

      - name: Build the ISO
        run: |
          cp -r /usr/share/archiso/configs/releng /tmp/kestrel_profile
          echo -e "\n[chaotic-aur]\nSigLevel = Optional TrustAll\nInclude = /etc/pacman.d/chaotic-mirrorlist" >> /tmp/kestrel_profile/pacman.conf

          echo -e "zsh\ncage\nkitty\nmesa\nttf-dejavu\npolkit\npciutils\nxorg-xwayland\nparted\nbtrfs-progs\ndosfstools\nntfs-3g\ne2fsprogs\nxfsprogs\ngparted\nchaotic-keyring\nchaotic-mirrorlist" >> /tmp/kestrel_profile/packages.x86_64

          mkdir -p /tmp/kestrel_profile/airootfs/usr/local/bin
          mkdir -p /tmp/kestrel_profile/airootfs/root

          cp airootfs/gui-src/target/release/kestrel-gui /tmp/kestrel_profile/airootfs/usr/local/bin/kestrel-gui
          cp airootfs/gui-src/target/release/kestrel-doctor /tmp/kestrel_profile/airootfs/usr/local/bin/kestrel-doctor

          sed -i 's/^iso_name=.*/iso_name="Kestrel-Arch(online)"/' /tmp/kestrel_profile/profiledef.sh

          sed -i '/file_permissions=(/a \  ["/usr/local/bin/kestrel-gui"]="0:0:755"\n  ["/usr/local/bin/kestrel-doctor"]="0:0:755"' /tmp/kestrel_profile/profiledef.sh

          sed -i 's/^compressor=.*/compressor="zstd"/' /tmp/kestrel_profile/profiledef.sh

          {
            echo 'export XDG_RUNTIME_DIR=/run/user/$(id -u)'
            echo 'export WLR_NO_HARDWARE_CURSORS=1'
            echo 'export WLR_RENDERER_ALLOW_SOFTWARE=1'
            echo 'IS_VM=$(systemd-detect-virt -q && echo 1 || echo 0)'
            echo 'HAS_NVIDIA=$(lspci | grep -iE "vga.*nvidia|3d.*nvidia" >/dev/null 2>&1 && echo 1 || echo 0)'
            echo 'if [ "$IS_VM" = "1" ] || [ "$HAS_NVIDIA" = "1" ]; then'
            echo '    export WLR_RENDERER=pixman'
            echo 'fi'
            echo 'if [ "$(tty)" = "/dev/tty1" ]; then'
            echo '    exec cage -s -- /usr/local/bin/kestrel-gui'
            echo 'fi'
          } > /tmp/kestrel_profile/airootfs/root/.zlogin

          mkdir -p out/
          mkarchiso -v -w /tmp/archiso-tmp -o out/ /tmp/kestrel_profile/

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Arch-ISO-Online
          path: out/*.iso

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO_ONLINE }}
        run: |
          pip install huggingface_hub --break-system-packages

          ISO_FILE=$(ls out/*.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: No ISO file found in out/"
            exit 1
          fi
          ISO_NAME=$(basename "$ISO_FILE")

          python -c "
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_REPO']
          iso_path = '$ISO_FILE'
          iso_name = '$ISO_NAME'

          try:
              api.delete_repo(repo_id=repo, repo_type='dataset')
              print(f'Deleted old {repo}')
          except Exception as e:
              print(f'Repo did not exist or could not be deleted: {e}')

          api.create_repo(repo_id=repo, repo_type='dataset', private=False)
          print(f'Uploading {iso_name} directly to {repo}...')
          api.upload_file(
              path_or_fileobj=iso_path,
              path_in_repo=iso_name,
              repo_id=repo,
              repo_type='dataset',
              commit_message=f'Automated Online ISO deployment: {iso_name} [skip ci]'
          )
          print('=> Direct Hugging Face upload complete!')
          "

      - name: Create or Update Rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO_ONLINE }}
        run: |
          ISO_FILE=$(basename $(ls out/*.iso 2>/dev/null | head -n 1))

          DOWNLOAD_URL="https://huggingface.co{HF_REPO}/resolve/main/${ISO_FILE}?download=true"
          RELEASE_TAG="latest-online-iso"

          git config --global --add safe.directory '*' || true

          CHANGELOG=$(git log -10 --pretty=format:"- %s" -- airootfs/ 2>/dev/null)
          [ -z "$CHANGELOG" ] && CHANGELOG="- Routine updates and maintenance."

          {
            echo "### 🦅 Kestrel Arch - Latest Deployment (Online Net-Installer)"
            echo ""
            echo "**Note:** ISO is hosted on our high-speed Hugging Face CDN for maximum download speeds."
            echo "✅ **[Download $ISO_FILE Here]($DOWNLOAD_URL)**"
            echo ""
            echo "### 🚀 What's Improved or Fixed"
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo "*Updated automatically via GitHub Actions.*"
          } > release_notes.md

          gh release delete "$RELEASE_TAG" -y 2>/dev/null || true

          git tag -f "$RELEASE_TAG"
          git push origin "$RELEASE_TAG" --force

          gh release create "$RELEASE_TAG" \
            --title "Kestrel Arch Latest Online ISO" \
            --notes-file release_notes.md \
            --latest
