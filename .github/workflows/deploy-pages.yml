name: Deploy Rust Web Landing Page

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target

      - name: Cache Dioxus CLI
        id: cache-dx
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dioxus-cli-v0.5

      - name: Install Dioxus CLI
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm dioxus-cli

      - name: Build WebAssembly Site
        run: |
          cd web
          dx build --release --base-path "/Kestrel-Installer/"
          cd ..

          mkdir -p dist

          if [ -d "target/dx/kestrel-web/release/web/public" ]; then
            cp -r target/dx/kestrel-web/release/web/public/* dist/
          elif [ -d "web/target/dx/kestrel-web/release/web/public" ]; then
            cp -r web/target/dx/kestrel-web/release/web/public/* dist/
          elif [ -d "web/dist" ]; then
            cp -r web/dist/* dist/
          fi

          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
