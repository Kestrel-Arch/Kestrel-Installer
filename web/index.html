<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kestrel Arch - Deployment & Recovery Engine</title>
  <base href="/Kestrel-Installer/">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            kestrel: {
              bg: '#020617',
              card: '#040D14',
              cyan: '#06B6D4',
              teal: '#14B8A6',
              light: '#A5F3FC',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      color: #E5E7EB;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .kestrel-glow {
      box-shadow: 0 0 40px -10px rgba(6, 182, 212, 0.25);
    }
    .kestrel-card-glow {
      box-shadow: 0 0 60px -15px rgba(6, 182, 212, 0.18);
    }
  </style>
</head>
<body class="bg-[#020617] text-gray-200 min-h-screen selection:bg-cyan-500 selection:text-black">
  <div id="main"></div>
</body>
</html>
