[application]
name = "kestrel-web"
default_platform = "web"
out_dir = "dist"
asset_dir = "public"

[web.app]
title = "Kestrel Arch — Deployment & Recovery Engine"

# Correct Dioxus 0.5 subpath base
[web]
base_path = "/Kestrel-Installer/"

[web.watcher]
reload_html = true
watch_path = ["src", "public"]
